name: Aggiorna Bandi
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Debug secrets
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "❌ GROQ_API_KEY è vuota o non trovata"
          else
            echo "✅ GROQ_API_KEY trovata (lunghezza: ${#GROQ_API_KEY})"
          fi
      - name: Esegui scraper
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scraper.py
      - name: Commit e push bandi.json aggiornato
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "BandiMonitor Bot"
          git add bandi.json
          git diff --staged --quiet || git commit -m "🤖 Ricalcolo score B2B - $(date '+%Y-%m-%d %H:%M')"
          git push
