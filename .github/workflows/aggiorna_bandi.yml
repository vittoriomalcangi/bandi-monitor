name: Aggiorna Bandi

on:
  # ── Run notturno automatico ──────────────────────────────────────────
  schedule:
    - cron: '0 1 * * *'   # ogni notte all'01:00 UTC

  # ── Trigger manuale da GitHub UI ────────────────────────────────────
  workflow_dispatch:
    inputs:
      modalita:
        description: 'Modalità di esecuzione'
        required: true
        default: 'normale'
        type: choice
        options:
          - normale        # aggiunge solo i nuovi bandi
          - ricalcola      # ricalcola tutti i bandi con il prompt attuale

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Esegui scraper
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          # Determina la modalità:
          # - nei run notturni (schedule) → sempre normale
          # - nei run manuali → usa l'input scelto dall'utente
          MODALITA="${{ github.event.inputs.modalita }}"
          if [ "$MODALITA" = "ricalcola" ]; then
            echo "🔄 Modalità: RICALCOLA (tutti i bandi esistenti)"
            python scraper.py --ricalcola
          else
            echo "▶ Modalità: NORMALE (solo nuovi bandi)"
            python scraper.py
          fi

      - name: Commit e push bandi.json
        run: |
          git config user.name  "BandiMonitor Bot"
          git config user.email "bot@bandimonitor"
          git add bandi.json
          git diff --staged --quiet || git commit -m "update: bandi $(date +'%Y-%m-%d %H:%M')"
          git push
