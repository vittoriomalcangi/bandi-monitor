name: Aggiorna Bandi

on:
  schedule:
    # Ogni notte alle 02:00 ora italiana (01:00 UTC)
    - cron: '0 1 * * *'
  # Permette di eseguirlo manualmente dal pannello Actions
  workflow_dispatch:

jobs:
  scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Esegui scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scraper.py

      - name: Commit e push bandi.json aggiornato
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "BandiMonitor Bot"
          git add bandi.json
          git diff --staged --quiet || git commit -m "🤖 Aggiorna bandi - $(date '+%Y-%m-%d %H:%M')"
          git push
