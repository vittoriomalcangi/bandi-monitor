name: Aggiorna Bandi

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Debug secrets (solo per test)
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "❌ GEMINI_API_KEY è vuota o non trovata"
          else
            echo "✅ GEMINI_API_KEY trovata (lunghezza: ${#GEMINI_API_KEY})"
          fi
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - name: Esegui scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scraper.py

      - name: Commit e push bandi.json aggiornato
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "BandiMonitor Bot"
          git add bandi.json
          git diff --staged --quiet || git commit -m "🤖 Aggiorna bandi - $(date '+%Y-%m-%d %H:%M')"
          git push
